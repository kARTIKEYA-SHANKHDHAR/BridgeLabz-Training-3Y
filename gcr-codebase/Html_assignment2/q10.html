<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <form>

        <label for="country">Country:</label>
        <select id="country">
            <option selected>India</option>
            <option>Japan</option>
            <option>France</option>
            <option>USA</option>
        </select>

        <br><br>

        <label for="state">State:</label>
        <select id="state">
            <option selected>Uttar Pradesh</option>
            <option>Delhi</option>
            <option>Maharashtra</option>
            <option>Goa</option>
        </select>

        <br><br>

        <label for="city">City:</label>
        <select id="city">
            <option selected>Lucknow</option>
            <option>Delhi</option>
            <option>Mumbai</option>
            <option>Goa</option>
        </select>

        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place">
            <option selected>Taj Mahal</option>
            <option>Gateway of India</option>
            <option>India Gate</option>
            <option>Eiffel Tower</option>
        </select>

    </form>

    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Lucknow, and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>
